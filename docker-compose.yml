services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solarmax
      POSTGRES_PASSWORD: solarmax
      POSTGRES_DB: solarmax
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarmax"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: solarmax
      DB_PASSWORD: solarmax
      DB_NAME: solarmax
      MEDIA_DIR: /app/media
      PORT: 8080
      JWT_SECRET: 1q13ek3094ri34
      JWT_EXPIRY_HOURS: "24"
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/media

volumes:
  pgdata:
  media_data:
